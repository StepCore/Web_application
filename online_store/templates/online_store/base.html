<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Интернет магазин{% endblock %}</title>
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/my_style.css" />
</head>
<body>
    <!-- Боковая панель -->
    {% include 'online_store/menu.html' %}
    <!-- Основной контент -->
    <div class="content">
        <div style="display: flex; justify-content: flex-end;">
            {% if user.is_authenticated %}
            <a href="{% url 'online_store:product_create' %}" class="btn btn-outline-dark" style="margin: 10px">Добавить товар</a>
            <a href="{% url 'users:logout' %}" class="btn btn-primary" style="margin: 10px">Выход</a>
            {% else %}
            <a href="{% url 'users:login' %}" class="btn btn-primary" style="margin: 10px">Вход</a>
            <a href="{% url 'users:register' %}" class="btn btn-primary" style="margin: 10px">Регистрация</a>
            {% endif %}
        </div>
        <h1 class="text-center">{% block main %}Главная{% endblock %}</h1>
        <p class="text-center" style="height: 50px;">{% block description %}Здесь вы можете посмотреть полный список товаров{% endblock %}</p>
        {% block content %} {% endblock %}
    </div>
<script src="/static/js/bootstrap.bundle.min.js"></script>
</body>
</html>
